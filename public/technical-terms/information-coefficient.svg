  <path d="M94 148H561M94 100H561M209 55V195M327 55V195M445 55V195" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M116 180L542 65" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 7"/>
  <g fill="#0f766e" stroke="#fff" stroke-width="2"><circle cx="124" cy="176" r="8"/><circle cx="158" cy="157" r="8"/><circle cx="194" cy="172" r="8"/><circle cx="230" cy="139" r="8"/><circle cx="270" cy="151" r="8"/><circle cx="301" cy="118" r="8"/><circle cx="338" cy="135" r="8"/><circle cx="375" cy="94" r="8"/><circle cx="410" cy="110" r="8"/><circle cx="447" cy="83" r="8"/><circle cx="491" cy="96" r="8"/><circle cx="536" cy="64" r="8"/></g>
  <g font-family="Arial, sans-serif" fill="#0f172a" font-size="28"><text x="327" y="246" text-anchor="middle">Prediction</text><text x="35" y="128" text-anchor="middle" transform="rotate(-90 35 128)">Future return</text><text x="563" y="219" text-anchor="end" font-size="24" fill="#475569">Schematic</text></g>
