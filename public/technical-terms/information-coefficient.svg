<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Information Coefficient compares predictions with future returns</title>
  <desc id="desc">A schematic scatterplot shows an illustrative positive relationship between model predictions on the horizontal axis and future investment returns on the vertical axis. The points are not actual performance data.</desc>
  <text x="300" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">Predictions vs. future returns</text>
