<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Raft log replication and majority agreement</title>
  <desc id="desc">A leader replicates log entries A, B, and C to two followers. The leader and one follower have C, forming a two-of-three majority that can commit the current-term entry.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M202 105L384 67"/><path d="M202 130L384 171"/></g>
  <g font-family="Arial, sans-serif" font-size="28" fill="#0f172a" text-anchor="middle">
    <rect x="20" y="67" width="180" height="126" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="110" y="104" font-weight="700">Leader</text>
    <rect x="390" y="12" width="190" height="97" rx="14" fill="#d1fae5" stroke="#047857" stroke-width="2"/><text x="485" y="46">Follower</text>
    <rect x="390" y="126" width="190" height="97" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="485" y="160">Follower</text>
    <text x="110" y="159" font-family="monospace" font-size="32">A B C</text><text x="485" y="86" font-family="monospace" font-size="32">A B C</text><text x="485" y="200" font-family="monospace" font-size="32">A B –</text>
    <text x="290" y="114" font-size="24">copy log</text><text x="205" y="246" font-size="28" fill="#047857">2 of 3 → commit C</text>
  </g>
</svg>
