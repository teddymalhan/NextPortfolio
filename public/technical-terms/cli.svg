<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Command-line input and output</title>
  <desc id="desc">A terminal accepts a typed command to list files and prints the resulting filenames.</desc>
  <rect x="24" y="16" width="552" height="228" rx="16" fill="#0f172a"/>
  <path d="M24 58H576" stroke="#475569" stroke-width="2"/>
  <g fill="#94a3b8"><circle cx="47" cy="37" r="6"/><circle cx="68" cy="37" r="6"/><circle cx="89" cy="37" r="6"/></g>
  <text x="552" y="45" text-anchor="end" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1">terminal</text>
  <g font-family="monospace" font-size="28"><text x="46" y="105" fill="#5eead4">$ ls projects</text><text x="46" y="150" fill="#f8fafc">portfolio  database</text><text x="46" y="200" fill="#5eead4">$ <tspan fill="#f8fafc">▌</tspan></text></g>
  <g font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1" text-anchor="end"><text x="552" y="105">input</text><text x="552" y="150">output</text></g>
</svg>
