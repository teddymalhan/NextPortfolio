<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Serf spreads membership information through peer gossip</title>
  <desc id="desc">A schematic sequence shows node A gossiping a membership update to peers B and C, which forward it to other peers. There is no central broadcaster.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#0f766e"/></marker></defs>
  <g fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"><path d="M103 127L230 88"/><path d="M103 146L230 177"/><path d="M290 77L489 58"/><path d="M290 86L489 104"/><path d="M290 177L489 157"/><path d="M290 187L489 205"/></g>
  <g stroke="#0f766e" stroke-width="2"><circle cx="72" cy="137" r="32" fill="#0f766e"/><circle cx="261" cy="80" r="28" fill="#99f6e4"/><circle cx="261" cy="183" r="28" fill="#99f6e4"/><circle cx="520" cy="55" r="23" fill="#ccfbf1"/><circle cx="520" cy="105" r="23" fill="#ccfbf1"/><circle cx="520" cy="157" r="23" fill="#ccfbf1"/><circle cx="520" cy="207" r="23" fill="#ccfbf1"/></g>
  <g font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#134e4a"><text x="72" y="147" fill="#fff">A</text><text x="261" y="90">B</text><text x="261" y="193">C</text><text x="520" y="65">D</text><text x="520" y="115">E</text><text x="520" y="167">F</text><text x="520" y="217">G</text><text x="233" y="30" fill="#0f172a">Membership updates</text><text x="283" y="250" font-size="26" fill="#0f172a">Peers forward gossip to other peers</text></g>
</svg>
