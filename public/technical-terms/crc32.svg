<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">CRC32 summarizes bytes for error detection</title>
  <desc id="desc">Data bytes feed a CRC32 calculation that produces a 32-bit checksum. Recomputing and comparing the checksum can flag accidental data corruption; it is not cryptographic authentication.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs>
  <g font-family="Arial, sans-serif" font-size="28" fill="#0f172a" text-anchor="middle">
    <text x="94" y="42">Data bytes</text><text x="502" y="42">Checksum</text>
    <rect x="18" y="69" width="154" height="91" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><text x="95" y="108" font-family="monospace">0101</text><text x="95" y="143" font-family="monospace">1010…</text>
    <path d="M253 69H347L373 115L347 160H253L227 115Z" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/><text x="300" y="125">CRC32</text>
    <rect x="429" y="69" width="153" height="91" rx="10" fill="#d1fae5" stroke="#047857" stroke-width="2"/><text x="505" y="125">32 bits</text>
    <text x="300" y="207">Recompute + compare</text><text x="300" y="243" fill="#475569">Flags accidental corruption</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><path d="M176 115H216"/><path d="M377 115H418"/></g>
</svg>
