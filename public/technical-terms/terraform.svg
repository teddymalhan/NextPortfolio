  <rect x="354" y="28" width="224" height="178" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <g fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M99 55H151L171 75V133H99Z"/><path d="M151 55V75H171M113 90H154M113 105H149M113 120H141"/>
  </g>
