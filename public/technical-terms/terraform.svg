  <title id="title">Terraform turns configuration into managed infrastructure</title>
  <desc id="desc">Original illustration: human-readable configuration describes infrastructure resources. An apply arrow connects a configuration document to connected resource boxes. This is an explanatory workflow, not a claim about a particular deployment.</desc>
