<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-labelledby="title desc">
  <title id="title">Memtable holds recent writes in memory</title>
  <desc id="desc">Incoming writes enter a memtable in RAM, illustrated with sorted keys A, B, and C. A sealed memtable is flushed into a sorted table file on storage.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#475569"/></marker></defs>
  <rect x="189" y="23" width="215" height="212" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" stroke-dasharray="8 5"/>
  <g font-family="Arial, sans-serif" font-size="28" fill="#0f172a" text-anchor="middle"><text x="296" y="61" font-weight="700">RAM</text><text x="296" y="98">Memtable</text><text x="80" y="116">Writes</text><text x="501" y="60">Storage</text><text x="501" y="212">SST file</text></g>
  <rect x="219" y="112" width="155" height="101" rx="7" fill="#fff" stroke="#0369a1" stroke-width="2"/>
  <path d="M219 145H374M219 179H374" stroke="#bae6fd" stroke-width="2"/>
  <g font-family="monospace" font-size="26" fill="#0f172a" text-anchor="middle"><text x="296" y="138">A : 4</text><text x="296" y="172">B : 8</text><text x="296" y="205">C : 2</text></g>
  <path d="M464 90H525L548 113V178H464Z" fill="#d1fae5" stroke="#047857" stroke-width="2"/><path d="M525 90V113H548M479 133H533M479 152H533" fill="none" stroke="#047857" stroke-width="3"/>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><path d="M24 138H177"/><path d="M409 138H453"/></g>
  <text x="433" y="116" font-family="Arial, sans-serif" font-size="24" fill="#475569" text-anchor="middle">flush</text>
</svg>
